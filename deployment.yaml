apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-energy-monitor
  labels:
    app: energy-monitor
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: energy-monitor
  template:
    metadata:
      labels:
        app: energy-monitor
    spec:
      containers:
      - name: energy-monitor
        image: DOCKERHUB_USERNAME/campus-energy-monitor:latest
        ports:
        - containerPort: 80
        imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: campus-energy-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: energy-monitor
